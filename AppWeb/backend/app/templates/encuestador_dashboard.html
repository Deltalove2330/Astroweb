<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuestador Médico - Jornada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --enc-primary: #6d28d9;
            --enc-success: #16a34a;
            --enc-danger: #dc2626;
            --enc-bg: #f5f3ff;
            --enc-text: #1e1b4b;
            --enc-border: #e9d5ff;
        }
        body { background: var(--enc-bg); color: var(--enc-text); }
        .enc-navbar {
            background: linear-gradient(135deg, #4c1d95 0%, #7c3aed 100%);
            color: #fff; padding: .9rem 1rem;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 8px rgba(109, 40, 217, .25);
            position: sticky; top: 0; z-index: 100;
        }
        .enc-navbar .title { font-weight: 600; font-size: 1.05rem; }
        .enc-container { max-width: 760px; margin: 0 auto; padding: 1rem; }

        .card-elev {
            background: #fff; border-radius: 16px;
            box-shadow: 0 4px 16px rgba(76, 29, 149, .08);
            padding: 1.5rem; margin-bottom: 1rem;
        }
        .activar-hero { text-align: center; padding: 2.5rem 1.5rem; }
        .activar-hero .bi { font-size: 3.5rem; color: var(--enc-primary); }
        .btn-activar {
            background: linear-gradient(135deg, var(--enc-success) 0%, #22c55e 100%);
            border: none; color: #fff; font-weight: 600; font-size: 1.1rem;
            padding: .9rem 1.5rem; border-radius: 12px; width: 100%;
            box-shadow: 0 4px 12px rgba(22, 163, 74, .3);
        }
        .btn-finalizar {
            background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
            border: none; color: #fff; font-weight: 600;
            padding: .65rem 1.25rem; border-radius: 10px;
        }
        .btn-primary-grad {
            background: linear-gradient(135deg, var(--enc-primary) 0%, #8b5cf6 100%);
            border: none; color: #fff; font-weight: 600;
            padding: .9rem 1.5rem; border-radius: 12px;
            box-shadow: 0 4px 12px rgba(109,40,217,.25);
        }
        .kpi-row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; margin: 1rem 0; }
        .kpi-card {
            background: #fff; border-radius: 12px; padding: 1rem;
            text-align: center; box-shadow: 0 2px 8px rgba(76,29,149,.05);
        }
        .kpi-card .v { font-size: 1.75rem; font-weight: 700; color: var(--enc-primary); }
        .kpi-card .l { font-size: .75rem; color: #64748b; text-transform: uppercase; letter-spacing: .5px; }
        .badge-jornada { background: #dcfce7; color: #166534; padding: .35rem .8rem; border-radius: 999px; font-size: .8rem; font-weight: 600; }
        .username { font-size: .85rem; opacity: .9; }
    </style>
</head>
<body>
    <nav class="enc-navbar">
        <div>
            <div class="title"><i class="bi bi-clipboard-pulse me-2"></i>Encuestador Médico</div>
            <div class="username"><i class="bi bi-person-circle"></i> {{ username }}</div>
        </div>
        <a href="/logout" class="text-white text-decoration-none" title="Cerrar sesión">
            <i class="bi bi-box-arrow-right fs-4"></i>
        </a>
    </nav>

    <div class="enc-container">
        <!-- Estado sin jornada -->
        <div id="sinJornada" class="card-elev activar-hero" style="display:none;">
            <i class="bi bi-play-circle"></i>
            <h4 class="mt-3 mb-2">Inicia tu jornada</h4>
            <p class="text-muted">Activa para comenzar a visitar centros de salud y registrar médicos.</p>
            <button class="btn-activar mt-3" id="btnActivar">
                <i class="bi bi-rocket-takeoff me-2"></i>Activar Jornada
            </button>
        </div>

        <!-- Estado con jornada -->
        <div id="conJornada" style="display:none;">
            <div class="card-elev">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <span class="badge-jornada"><i class="bi bi-check-circle"></i> Jornada activa</span>
                        <div class="mt-2 text-muted small">
                            Iniciada: <span id="fechaInicio">—</span>
                        </div>
                    </div>
                    <button class="btn-finalizar" id="btnFinalizar"><i class="bi bi-stop-circle"></i> Finalizar</button>
                </div>

                <div class="kpi-row">
                    <div class="kpi-card">
                        <div class="v" id="kpiCentros">0</div>
                        <div class="l">Centros visitados</div>
                    </div>
                    <div class="kpi-card">
                        <div class="v" id="kpiMedicos">0</div>
                        <div class="l">Médicos registrados</div>
                    </div>
                </div>

                <a href="/encuestador/centro" class="btn-primary-grad d-block text-center text-decoration-none">
                    <i class="bi bi-hospital me-2"></i>Ir al Centro de Salud
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
    const $ = (s) => document.querySelector(s);

    async function loadJornada() {
        const r = await fetch('/encuestador/api/jornada-activa').then(r => r.json());
        if (!r.success) return;
        if (r.activa) {
            $('#sinJornada').style.display = 'none';
            $('#conJornada').style.display = 'block';
            $('#fechaInicio').textContent = new Date(r.fecha_inicio).toLocaleString();
            $('#kpiCentros').textContent = r.centros_visitados || 0;
            $('#kpiMedicos').textContent = r.medicos_registrados || 0;
        } else {
            $('#sinJornada').style.display = 'block';
            $('#conJornada').style.display = 'none';
        }
    }

    $('#btnActivar').addEventListener('click', async () => {
        const payload = {};
        if (navigator.geolocation) {
            try {
                const pos = await new Promise((res, rej) =>
                    navigator.geolocation.getCurrentPosition(res, rej, { timeout: 5000 }));
                payload.latitud = pos.coords.latitude;
                payload.longitud = pos.coords.longitude;
            } catch(e) { /* ignorar GPS */ }
        }
        const r = await fetch('/encuestador/api/activar-jornada', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify(payload)
        }).then(r => r.json());
        if (!r.success) return Swal.fire('Error', r.message || 'No se pudo activar', 'error');
        await loadJornada();
        location.href = '/encuestador/centro';
    });

    $('#btnFinalizar').addEventListener('click', async () => {
        const ok = await Swal.fire({
            title: '¿Finalizar jornada?',
            text: 'No podrás registrar más médicos hasta abrir otra.',
            icon: 'warning', showCancelButton: true,
            confirmButtonColor: '#dc2626', confirmButtonText: 'Sí, finalizar'
        });
        if (!ok.isConfirmed) return;
        const r = await fetch('/encuestador/api/finalizar-jornada', { method: 'POST' }).then(r => r.json());
        if (!r.success) return Swal.fire('Error', r.message || 'No se pudo finalizar', 'error');
        Swal.fire('Listo', 'Jornada finalizada', 'success');
        await loadJornada();
    });

    loadJornada();
    </script>
</body>
</html>
