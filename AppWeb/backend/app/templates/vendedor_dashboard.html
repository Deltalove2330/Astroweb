<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendedor - Gestión de Ventas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --vd-primary: #2563eb;
            --vd-success: #16a34a;
            --vd-danger: #dc2626;
            --vd-bg: #f1f5f9;
            --vd-text: #1e293b;
            --vd-muted: #64748b;
            --vd-border: #e2e8f0;
        }

        body {
            background: var(--vd-bg);
            color: var(--vd-text);
            -webkit-tap-highlight-color: transparent;
        }

        .vd-navbar {
            background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
            color: #fff;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(37, 99, 235, .25);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .vd-navbar .vd-title {
            font-weight: 600;
            font-size: 1.05rem;
        }

        .vd-container {
            max-width: 720px;
            margin: 0 auto;
            padding: 1rem;
        }

        /* ── Activación ───────────────────────────── */
        .vd-activar-card {
            background: #fff;
            border-radius: 16px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            box-shadow: 0 4px 16px rgba(15, 23, 42, .08);
            margin-top: 2rem;
        }

        .vd-activar-card .bi {
            font-size: 3.5rem;
            color: var(--vd-primary);
        }

        .btn-activar {
            background: linear-gradient(135deg, var(--vd-success) 0%, #22c55e 100%);
            border: none;
            color: #fff;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 0.9rem 1.5rem;
            border-radius: 12px;
            width: 100%;
            box-shadow: 0 4px 12px rgba(22, 163, 74, .3);
        }

        .btn-activar:active {
            transform: scale(.98);
        }

        /* ── Barra de jornada ─────────────────────── */
        .vd-jornada-bar {
            background: #fff;
            border-radius: 12px;
            padding: 0.85rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            box-shadow: 0 2px 8px rgba(15, 23, 42, .06);
            margin-bottom: 1rem;
        }

        .vd-jornada-bar .vd-jornada-info {
            font-size: 0.85rem;
            color: var(--vd-muted);
            line-height: 1.3;
        }

        .vd-jornada-bar .vd-jornada-info strong {
            color: var(--vd-text);
        }

        .vd-badge-visitas {
            background: var(--vd-primary);
            color: #fff;
            border-radius: 999px;
            padding: 0.15rem 0.6rem;
            font-size: 0.78rem;
            font-weight: 600;
        }

        /* ── Buscador ─────────────────────────────── */
        .vd-search {
            position: relative;
            margin-bottom: 0.85rem;
        }

        .vd-search .bi-search {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--vd-muted);
        }

        .vd-search input {
            width: 100%;
            padding: 0.7rem 0.9rem 0.7rem 2.4rem;
            border: 1px solid var(--vd-border);
            border-radius: 10px;
            font-size: 0.95rem;
        }

        .vd-search input:focus {
            outline: none;
            border-color: var(--vd-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
        }

        /* ── Listas ───────────────────────────────── */
        .vd-list {
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
        }

        .vd-item {
            background: #fff;
            border: 1px solid var(--vd-border);
            border-radius: 12px;
            padding: 0.85rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            transition: box-shadow .12s, transform .08s;
        }

        .vd-item:active {
            transform: scale(.99);
        }

        .vd-item:hover {
            box-shadow: 0 4px 12px rgba(15, 23, 42, .1);
            border-color: var(--vd-primary);
        }

        .vd-item .vd-item-icon {
            font-size: 1.4rem;
            color: var(--vd-primary);
            flex-shrink: 0;
        }

        .vd-item .vd-item-body {
            flex-grow: 1;
            min-width: 0;
        }

        .vd-item .vd-item-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .vd-item .vd-item-sub {
            font-size: 0.8rem;
            color: var(--vd-muted);
        }

        .vd-item .bi-chevron-right {
            color: var(--vd-muted);
            flex-shrink: 0;
        }

        .vd-empty {
            text-align: center;
            color: var(--vd-muted);
            padding: 2rem 1rem;
            font-style: italic;
        }

        .vd-section-head {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.85rem;
        }

        .vd-back-btn {
            background: #fff;
            border: 1px solid var(--vd-border);
            border-radius: 10px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--vd-text);
            flex-shrink: 0;
        }

        .vd-section-head .vd-section-title {
            font-weight: 600;
            font-size: 1rem;
            line-height: 1.2;
        }

        .vd-section-head .vd-section-sub {
            font-size: 0.8rem;
            color: var(--vd-muted);
        }

        .vd-spinner {
            text-align: center;
            padding: 2.5rem 1rem;
        }

        .d-none {
            display: none !important;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <div class="vd-navbar">
        <span class="vd-title"><i class="bi bi-bag-check me-2"></i>Vendedor</span>
        <div class="d-flex align-items-center gap-2">
            <span class="small">{{ username }}</span>
            <a href="/logout" class="btn btn-sm btn-light" title="Cerrar sesión">
                <i class="bi bi-box-arrow-right"></i>
            </a>
        </div>
    </div>

    <div class="vd-container">

        <!-- Spinner inicial -->
        <div id="view-loading" class="vd-spinner">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-3 text-muted">Cargando...</p>
        </div>

        <!-- VISTA: Jornada inactiva → Activación de Ruta -->
        <div id="view-jornada-inactiva" class="d-none">
            <div class="vd-activar-card">
                <i class="bi bi-geo-alt"></i>
                <h4 class="mt-3 mb-2">¿Listo para trabajar?</h4>
                <p class="text-muted mb-4">Activa tu ruta para comenzar a registrar tus visitas y ventas del día.</p>
                <button class="btn-activar" id="btnActivarJornada">
                    <i class="bi bi-power me-2"></i>Activación de Ruta
                </button>
            </div>
        </div>

        <!-- VISTA: Jornada activa -->
        <div id="view-jornada-activa" class="d-none">

            <!-- Barra de jornada -->
            <div class="vd-jornada-bar">
                <div class="vd-jornada-info">
                    <strong><i class="bi bi-check-circle-fill text-success me-1"></i>Ruta activa</strong><br>
                    <span id="jornadaInicioTxt">—</span>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="vd-badge-visitas" id="badgeVisitas" title="Visitas registradas">0</span>
                    <button class="btn btn-sm btn-outline-secondary" id="btnVerVisitas" title="Ver visitas">
                        <i class="bi bi-list-check"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger" id="btnFinalizarJornada">
                        Finalizar
                    </button>
                </div>
            </div>

            <!-- SUB-VISTA: lista de PDVs -->
            <div id="view-pdvs">
                <div class="vd-section-head">
                    <div>
                        <div class="vd-section-title"><i class="bi bi-shop me-1"></i>Puntos de venta</div>
                        <div class="vd-section-sub">Selecciona el PDV que vas a visitar</div>
                    </div>
                    <button class="btn btn-sm btn-outline-primary ms-auto" id="btnSolicitarPDV" title="Solicitar creación de un PDV nuevo">
                        <i class="bi bi-plus-circle me-1"></i>Solicitar PDV
                    </button>
                </div>
                <div class="vd-search">
                    <i class="bi bi-search"></i>
                    <input type="text" id="buscarPDV" placeholder="Buscar PDV por nombre, ciudad..." autocomplete="off">
                </div>
                <div class="vd-list" id="listaPDVs"></div>
            </div>

            <!-- SUB-VISTA: lista de clientes -->
            <div id="view-clientes" class="d-none">
                <div class="vd-section-head">
                    <button class="vd-back-btn" id="btnVolverPDVs"><i class="bi bi-arrow-left"></i></button>
                    <div>
                        <div class="vd-section-title"><i class="bi bi-people me-1"></i>Clientes</div>
                        <div class="vd-section-sub">PDV: <span id="pdvSeleccionadoTxt">—</span></div>
                    </div>
                </div>
                <div class="vd-search">
                    <i class="bi bi-search"></i>
                    <input type="text" id="buscarCliente" placeholder="Buscar cliente..." autocomplete="off">
                </div>
                <div class="vd-list" id="listaClientes"></div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/modules/vendedor.js') }}?v=20260519"></script>
    <!-- Mensajería de grupos (mismo widget flotante del resto de la app) -->
    <script src="{{ url_for('static', filename='js/chat-grupos.js') }}" defer></script>
</body>

</html>
