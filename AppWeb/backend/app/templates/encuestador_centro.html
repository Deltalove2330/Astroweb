<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuestador - Centro de Salud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --enc-primary: #6d28d9;
            --enc-bg: #f5f3ff;
            --enc-text: #1e1b4b;
        }
        body { background: var(--enc-bg); color: var(--enc-text); }
        .enc-navbar {
            background: linear-gradient(135deg, #4c1d95 0%, #7c3aed 100%);
            color: #fff; padding: .85rem 1rem;
            display:flex; align-items:center; justify-content:space-between;
            box-shadow: 0 2px 8px rgba(109,40,217,.25);
            position: sticky; top: 0; z-index: 100;
        }
        .enc-container { max-width: 920px; margin: 0 auto; padding: 1rem; }
        .card-elev { background: #fff; border-radius: 16px; box-shadow: 0 4px 16px rgba(76,29,149,.08); padding: 1.25rem; margin-bottom: 1rem; }
        .btn-grad { background: linear-gradient(135deg, var(--enc-primary) 0%, #8b5cf6 100%); border: none; color: #fff; font-weight: 600; }
        .btn-grad:hover { color: #fff; opacity: .92; }
        .badge-centro { background:#ede9fe; color:#5b21b6; padding:.45rem .9rem; border-radius: 999px; font-weight: 600; }
        .medico-row { display:flex; justify-content:space-between; align-items:center; padding:.75rem; border:1px solid #ede9fe; border-radius:10px; margin-bottom:.5rem; }
        .medico-row .small { color: #64748b; font-size:.8rem; }
        .step-title { font-weight: 700; color: var(--enc-primary); border-left: 4px solid var(--enc-primary); padding-left: .75rem; margin: 1.5rem 0 1rem; }
        .form-label { font-weight: 600; font-size: .85rem; }
        .required::after { content: ' *'; color: #dc2626; }
        .autocomplete-results {
            max-height: 250px; overflow-y: auto;
            border: 1px solid #ede9fe; border-radius: 10px; margin-top: .5rem;
        }
        .autocomplete-results .item { padding: .6rem .9rem; cursor: pointer; border-bottom: 1px solid #f5f3ff; }
        .autocomplete-results .item:hover { background: #faf5ff; }
        .autocomplete-results .item:last-child { border-bottom: none; }
        .step { display:none; }
        .step.active { display:block; }
        .crumb { color:#64748b; font-size:.85rem; }
        .crumb a { color: var(--enc-primary); text-decoration:none; }
    </style>
</head>
<body>
    <nav class="enc-navbar">
        <div class="d-flex align-items-center gap-2">
            <a href="/encuestador/" class="text-white text-decoration-none"><i class="bi bi-arrow-left fs-5"></i></a>
            <strong>Centro de Salud</strong>
        </div>
        <div id="centroBadge" style="display:none;"></div>
    </nav>

    <div class="enc-container">
        <div class="crumb mb-2">
            <a href="/encuestador/">Inicio</a> &raquo; Centro de Salud
        </div>

        <!-- ========================================================
             STEP 1: SELECCIONAR / CREAR CENTRO
             ======================================================== -->
        <div id="step-centro" class="step active">
            <div class="card-elev">
                <h5 class="mb-3"><i class="bi bi-hospital me-2"></i>Selecciona un centro</h5>
                <input type="text" class="form-control" id="centroSearch"
                       placeholder="Buscar por nombre, ciudad o estado…">
                <div class="autocomplete-results" id="centroResults"></div>
                <hr>
                <button class="btn btn-outline-primary w-100" data-bs-toggle="modal" data-bs-target="#mdlNuevoCentro">
                    <i class="bi bi-plus-circle me-2"></i>Crear nuevo centro
                </button>
            </div>
        </div>

        <!-- ========================================================
             STEP 2: ENCUESTA DEL CENTRO ABIERTA — agregar médicos
             ======================================================== -->
        <div id="step-medicos" class="step">
            <div class="card-elev">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <div>
                        <h5 class="mb-1" id="centroNombre">—</h5>
                        <div class="small text-muted" id="centroSubt">—</div>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-grad" id="btnAgregarMedico">
                            <i class="bi bi-person-plus me-1"></i>Agregar médico
                        </button>
                        <button class="btn btn-outline-danger" id="btnCerrarEncuesta">
                            <i class="bi bi-check2-circle me-1"></i>Cerrar centro
                        </button>
                    </div>
                </div>

                <hr>
                <div class="d-flex justify-content-between">
                    <strong>Médicos registrados en este centro</strong>
                    <span class="badge bg-purple" id="medicosCount" style="background: var(--enc-primary)!important;">0</span>
                </div>
                <div id="medicosList" class="mt-3"><div class="text-muted small">Aún no hay médicos registrados.</div></div>
            </div>
        </div>
    </div>

    <!-- ============ MODAL: NUEVO CENTRO ============ -->
    <div class="modal fade" id="mdlNuevoCentro" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title"><i class="bi bi-plus-circle"></i> Nuevo centro de salud</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-2">
                <label class="form-label required">Nombre del centro</label>
                <input class="form-control" id="ncNombre">
            </div>
            <div class="mb-2">
                <label class="form-label required">Dirección completa</label>
                <textarea class="form-control" id="ncDir" rows="2"></textarea>
            </div>
            <div class="row">
                <div class="col-6 mb-2">
                    <label class="form-label">Ciudad</label>
                    <input class="form-control" id="ncCiudad">
                </div>
                <div class="col-6 mb-2">
                    <label class="form-label">Estado</label>
                    <input class="form-control" id="ncEstado">
                </div>
            </div>
            <div class="mb-2">
                <label class="form-label">Fuente de información</label>
                <select class="form-select" id="ncFuente"></select>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button class="btn btn-grad" id="btnCrearCentro"><i class="bi bi-check2"></i> Crear y abrir encuesta</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ MODAL: AGREGAR MÉDICO ============ -->
    <div class="modal fade" id="mdlMedico" tabindex="-1">
      <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title"><i class="bi bi-person-vcard"></i> Agregar médico al centro</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">

            <!-- Búsqueda de médico existente -->
            <div class="card-elev" style="background:#faf5ff;">
                <label class="form-label">¿Ya existe el médico? Búscalo por ID o apellido:</label>
                <input class="form-control" id="medSearch" placeholder="Ej: V-12345678 o Pérez">
                <div class="autocomplete-results" id="medResults"></div>
            </div>

            <div class="step-title">1. Datos del médico</div>
            <div class="row g-2">
                <div class="col-md-4">
                    <label class="form-label required">ID Médico (cédula/identificador externo)</label>
                    <input class="form-control" id="m_id_externo">
                </div>
                <div class="col-md-4">
                    <label class="form-label required">Apellido 1</label>
                    <input class="form-control" id="m_ap1">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Apellido 2</label>
                    <input class="form-control" id="m_ap2">
                </div>
                <div class="col-md-4">
                    <label class="form-label required">Nombre 1</label>
                    <input class="form-control" id="m_n1">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Nombre 2</label>
                    <input class="form-control" id="m_n2">
                </div>
                <div class="col-md-4">
                    <label class="form-label required">Especialidad</label>
                    <input class="form-control" id="m_esp">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Sub-especialidad</label>
                    <input class="form-control" id="m_sub">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Universidad de graduación</label>
                    <input class="form-control" id="m_uni">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Nº MPPS</label>
                    <input class="form-control" id="m_mpps">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Nº Colegiado</label>
                    <input class="form-control" id="m_col">
                </div>
                <div class="col-md-3">
                    <label class="form-label required">Ciudad</label>
                    <input class="form-control" id="m_ciudad">
                </div>
                <div class="col-md-3">
                    <label class="form-label required">Estado</label>
                    <input class="form-control" id="m_estado">
                </div>
                <div class="col-md-3"><label class="form-label">Teléfono</label><input class="form-control" id="m_tel"></div>
                <div class="col-md-3"><label class="form-label">WhatsApp</label><input class="form-control" id="m_wa"></div>
                <div class="col-md-3"><label class="form-label">Email</label><input class="form-control" id="m_email"></div>
                <div class="col-md-3"><label class="form-label">Instagram</label><input class="form-control" id="m_ig"></div>
                <div class="col-md-12"><label class="form-label">LinkedIn</label><input class="form-control" id="m_li"></div>
            </div>

            <div class="step-title">2. Datos del consultorio 1 (en este centro)</div>
            <div class="row g-2">
                <div class="col-md-3"><label class="form-label"># Piso / Consultorio</label><input class="form-control" id="c1_piso"></div>
                <div class="col-md-4"><label class="form-label">Horarios de consulta</label><input class="form-control" id="c1_hor" placeholder="Ej: 8:00 - 12:00"></div>
                <div class="col-md-5"><label class="form-label">Días de consulta</label>
                    <div id="c1_dias_box" class="d-flex flex-wrap gap-2"></div>
                </div>
                <div class="col-12"><label class="form-label">Dirección específica</label>
                    <textarea class="form-control" id="c1_dir" rows="1"></textarea>
                </div>
            </div>

            <div class="step-title">3. Consultorio 2 (opcional)</div>
            <div class="row g-2">
                <div class="col-md-4"><label class="form-label">Clínica 2 (nombre)</label><input class="form-control" id="c2_nom"></div>
                <div class="col-md-2"><label class="form-label"># Piso</label><input class="form-control" id="c2_piso"></div>
                <div class="col-md-3"><label class="form-label">Horarios</label><input class="form-control" id="c2_hor"></div>
                <div class="col-md-3"><label class="form-label">Días</label>
                    <div id="c2_dias_box" class="d-flex flex-wrap gap-2"></div>
                </div>
                <div class="col-12"><label class="form-label">Dirección 2</label>
                    <textarea class="form-control" id="c2_dir" rows="1"></textarea>
                </div>
            </div>

            <div class="step-title">4. Datos económicos</div>
            <div class="row g-2">
                <div class="col-md-6">
                    <label class="form-label required">Valor de la consulta</label>
                    <select class="form-select" id="m_valor"></select>
                </div>
                <div class="col-md-6">
                    <label class="form-label required">Promedio de pacientes / semana</label>
                    <select class="form-select" id="m_prom"></select>
                </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button class="btn btn-grad" id="btnGuardarMedico"><i class="bi bi-check2-circle"></i> Guardar médico</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
    /* ============================================================
       Estado y helpers
       ============================================================ */
    const $ = s => document.querySelector(s);
    let CATALOGOS = {};
    let CENTRO_SELECCIONADO = null;     // {id_centro, nombre, ciudad, estado}
    let ENCUESTA_ID = null;             // id_encuesta abierta

    function debounce(fn, ms=300){ let t; return (...a)=>{clearTimeout(t); t=setTimeout(()=>fn(...a),ms);} }

    /* ============================================================
       Bootstrap inicial
       ============================================================ */
    (async function init(){
        // Cargar catálogos
        CATALOGOS = await fetch('/encuestador/api/catalogos').then(r=>r.json());

        // Llenar selects fijos
        const valor = $('#m_valor'); valor.innerHTML = '<option value="">Seleccione…</option>' +
            CATALOGOS.valor_consulta_rangos.map(v=>`<option>${v}</option>`).join('');
        const prom = $('#m_prom'); prom.innerHTML = '<option value="">Seleccione…</option>' +
            CATALOGOS.promedio_pacientes_rangos.map(v=>`<option>${v}</option>`).join('');
        const fuente = $('#ncFuente'); fuente.innerHTML =
            CATALOGOS.fuentes_informacion.map(v=>`<option>${v}</option>`).join('');

        // Checkboxes de días
        ['c1_dias_box','c2_dias_box'].forEach(boxId=>{
            const box = document.getElementById(boxId);
            box.innerHTML = CATALOGOS.dias_consulta.map(d=>`
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" value="${d}" id="${boxId}_${d}">
                    <label class="form-check-label small" for="${boxId}_${d}">${d.slice(0,3)}</label>
                </div>`).join('');
        });

        // Verificar si hay encuesta abierta
        const r = await fetch('/encuestador/api/encuesta-abierta').then(r=>r.json());
        if (!r.success) return Swal.fire('Error', r.message, 'error');
        if (!r.jornada_activa) {
            Swal.fire('Jornada inactiva', 'Debes activar la jornada primero.', 'warning')
                .then(()=>location.href='/encuestador/');
            return;
        }
        if (r.tiene_encuesta) {
            CENTRO_SELECCIONADO = { id_centro: r.id_centro, nombre: r.nombre_centro,
                                    ciudad: r.ciudad, estado: r.estado };
            ENCUESTA_ID = r.id_encuesta;
            entrarAStepMedicos(r.medicos);
        } else {
            // Cargar centros iniciales para mostrar algunos
            buscarCentros('');
        }
    })();

    /* ============================================================
       STEP 1: buscar / crear centro
       ============================================================ */
    async function buscarCentros(q){
        const r = await fetch('/encuestador/api/centros?q=' + encodeURIComponent(q)).then(r=>r.json());
        const box = $('#centroResults');
        if (!r.success || !r.centros.length) { box.innerHTML = '<div class="p-3 text-muted small">Sin resultados.</div>'; return; }
        box.innerHTML = r.centros.map(c=>`
            <div class="item" data-id="${c.id_centro}" data-nombre="${c.nombre_centro}"
                 data-ciudad="${c.ciudad||''}" data-estado="${c.estado||''}">
                <strong>${c.nombre_centro}</strong>
                <div class="small text-muted">${c.ciudad||''} ${c.estado?' · '+c.estado:''}</div>
            </div>`).join('');
        box.querySelectorAll('.item').forEach(it=>{
            it.addEventListener('click', ()=>iniciarEncuesta({
                id_centro: parseInt(it.dataset.id),
                nombre: it.dataset.nombre,
                ciudad: it.dataset.ciudad,
                estado: it.dataset.estado
            }));
        });
    }
    $('#centroSearch').addEventListener('input', debounce(e=>buscarCentros(e.target.value), 300));

    async function iniciarEncuesta(centro){
        const ok = await Swal.fire({
            title: '¿Iniciar encuesta?',
            html: `<strong>${centro.nombre}</strong><br><small>${centro.ciudad||''} ${centro.estado?'· '+centro.estado:''}</small>`,
            icon: 'question', showCancelButton: true, confirmButtonText: 'Sí, abrir centro'
        });
        if (!ok.isConfirmed) return;

        const r = await fetch('/encuestador/api/encuestas', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ id_centro: centro.id_centro,
                                   fuente_informacion: CATALOGOS.fuentes_informacion[0] })
        }).then(r=>r.json());
        if (!r.success) return Swal.fire('Error', r.message || 'No se pudo abrir', 'error');
        CENTRO_SELECCIONADO = centro;
        ENCUESTA_ID = r.id_encuesta;
        entrarAStepMedicos([]);
    }

    $('#btnCrearCentro').addEventListener('click', async ()=>{
        const body = {
            nombre_centro: $('#ncNombre').value.trim(),
            direccion_completa: $('#ncDir').value.trim(),
            ciudad: $('#ncCiudad').value.trim(),
            estado: $('#ncEstado').value.trim()
        };
        if (!body.nombre_centro || !body.direccion_completa)
            return Swal.fire('Error', 'Nombre y dirección son obligatorios', 'warning');
        const r = await fetch('/encuestador/api/centros', {
            method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
        }).then(r=>r.json());
        if (!r.success) return Swal.fire('Error', r.message, 'error');
        bootstrap.Modal.getInstance('#mdlNuevoCentro').hide();
        iniciarEncuesta({ id_centro: r.id_centro, nombre: r.nombre_centro,
                          ciudad: r.ciudad, estado: r.estado });
    });

    /* ============================================================
       STEP 2: gestión de médicos en el centro
       ============================================================ */
    function entrarAStepMedicos(medicos){
        $('#step-centro').classList.remove('active');
        $('#step-medicos').classList.add('active');
        $('#centroNombre').textContent = CENTRO_SELECCIONADO.nombre;
        $('#centroSubt').textContent = [CENTRO_SELECCIONADO.ciudad, CENTRO_SELECCIONADO.estado]
                                       .filter(Boolean).join(' · ') || '—';
        $('#centroBadge').style.display = '';
        $('#centroBadge').innerHTML = `<span class="badge-centro">${CENTRO_SELECCIONADO.nombre}</span>`;
        renderMedicos(medicos || []);
    }

    function renderMedicos(meds){
        $('#medicosCount').textContent = meds.length;
        if (!meds.length) {
            $('#medicosList').innerHTML = '<div class="text-muted small">Aún no hay médicos registrados.</div>';
            return;
        }
        $('#medicosList').innerHTML = meds.map(m=>`
            <div class="medico-row">
              <div>
                <strong>${m.apellido1} ${m.apellido2||''}, ${m.nombre1} ${m.nombre2||''}</strong>
                <div class="small">${m.especialidad} · ID ${m.id_medico_externo}</div>
              </div>
              <div class="text-end">
                <div class="small"><i class="bi bi-cash"></i> ${m.valor_consulta_rango}</div>
                <div class="small"><i class="bi bi-people"></i> ${m.promedio_pacientes_semanal_rango}</div>
              </div>
            </div>`).join('');
    }

    async function recargarEncuesta(){
        const r = await fetch('/encuestador/api/encuesta-abierta').then(r=>r.json());
        if (r.tiene_encuesta) renderMedicos(r.medicos);
    }

    /* ---- Modal: agregar médico ---- */
    $('#btnAgregarMedico').addEventListener('click', ()=>{
        document.querySelectorAll('#mdlMedico input, #mdlMedico select, #mdlMedico textarea')
            .forEach(el=>{ if (el.type==='checkbox') el.checked=false; else el.value=''; });
        $('#medResults').innerHTML = '';
        new bootstrap.Modal('#mdlMedico').show();
    });

    $('#medSearch').addEventListener('input', debounce(async e=>{
        const q = e.target.value.trim();
        if (q.length < 2) { $('#medResults').innerHTML=''; return; }
        const r = await fetch('/encuestador/api/medicos/buscar?q=' + encodeURIComponent(q)).then(r=>r.json());
        const box = $('#medResults');
        if (!r.medicos.length) { box.innerHTML='<div class="p-2 small text-muted">Sin coincidencias</div>'; return; }
        box.innerHTML = r.medicos.map(m=>`
            <div class="item" data-json='${JSON.stringify(m).replace(/'/g,"&apos;")}'>
                <strong>${m.apellido1} ${m.apellido2||''}, ${m.nombre1}</strong>
                <div class="small text-muted">${m.especialidad} · ${m.id_medico_externo}</div>
            </div>`).join('');
        box.querySelectorAll('.item').forEach(it=>{
            it.addEventListener('click', ()=>{
                const m = JSON.parse(it.dataset.json.replace(/&apos;/g,"'"));
                $('#m_id_externo').value = m.id_medico_externo;
                $('#m_ap1').value = m.apellido1 || ''; $('#m_ap2').value = m.apellido2 || '';
                $('#m_n1').value  = m.nombre1   || ''; $('#m_n2').value  = m.nombre2   || '';
                $('#m_esp').value = m.especialidad || '';
                $('#m_sub').value = m.sub_especialidad || '';
                $('#m_uni').value = m.universidad_graduacion || '';
                $('#m_mpps').value= m.nro_MPPS || ''; $('#m_col').value = m.nro_colegiado || '';
                $('#m_ciudad').value = m.ciudad || ''; $('#m_estado').value = m.estado || '';
                $('#m_tel').value = m.telefono || ''; $('#m_wa').value = m.whatsapp || '';
                $('#m_email').value = m.email || ''; $('#m_ig').value = m.instagram || '';
                $('#m_li').value = m.linkedin || '';
                $('#m_id_externo').dataset.id_medico = m.id_medico;
                box.innerHTML = '';
                $('#medSearch').value = `${m.apellido1}, ${m.nombre1}`;
            });
        });
    }, 300));

    function getDias(boxId){
        return Array.from(document.querySelectorAll(`#${boxId} input:checked`)).map(c=>c.value).join(',');
    }

    $('#btnGuardarMedico').addEventListener('click', async ()=>{
        const id_medico = parseInt($('#m_id_externo').dataset.id_medico || '0') || null;
        const body = {
            id_medico,
            id_medico_externo: $('#m_id_externo').value.trim(),
            apellido1: $('#m_ap1').value.trim(), apellido2: $('#m_ap2').value.trim(),
            nombre1: $('#m_n1').value.trim(),    nombre2: $('#m_n2').value.trim(),
            especialidad: $('#m_esp').value.trim(),
            sub_especialidad: $('#m_sub').value.trim(),
            universidad_graduacion: $('#m_uni').value.trim(),
            nro_MPPS: $('#m_mpps').value.trim(),
            nro_colegiado: $('#m_col').value.trim(),
            ciudad: $('#m_ciudad').value.trim(),
            estado: $('#m_estado').value.trim(),
            telefono: $('#m_tel').value.trim(),
            whatsapp: $('#m_wa').value.trim(),
            email: $('#m_email').value.trim(),
            instagram: $('#m_ig').value.trim(),
            linkedin: $('#m_li').value.trim(),
            piso_consultorio: $('#c1_piso').value.trim(),
            horarios_consulta: $('#c1_hor').value.trim(),
            dias_consulta: getDias('c1_dias_box'),
            direccion_especifica: $('#c1_dir').value.trim(),
            clinica2_nombre: $('#c2_nom').value.trim(),
            piso_consultorio2: $('#c2_piso').value.trim(),
            horarios_consulta2: $('#c2_hor').value.trim(),
            dias_consulta2: getDias('c2_dias_box'),
            direccion_especifica2: $('#c2_dir').value.trim(),
            valor_consulta_rango: $('#m_valor').value,
            promedio_pacientes_semanal_rango: $('#m_prom').value
        };
        const r = await fetch('/encuestador/api/medico-centro', {
            method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
        }).then(r=>r.json());
        if (!r.success) return Swal.fire('Error', r.message || 'No se pudo guardar', 'error');
        bootstrap.Modal.getInstance('#mdlMedico').hide();
        Swal.fire({ icon:'success', title:'Médico agregado', timer:1200, showConfirmButton:false });
        recargarEncuesta();
    });

    $('#btnCerrarEncuesta').addEventListener('click', async ()=>{
        const ok = await Swal.fire({
            title: '¿Cerrar centro?',
            text: 'Podrás abrir otro centro a continuación.',
            icon:'question', showCancelButton:true, confirmButtonText:'Sí, cerrar'
        });
        if (!ok.isConfirmed) return;
        const r = await fetch(`/encuestador/api/encuestas/${ENCUESTA_ID}/cerrar`, { method:'POST' })
                  .then(r=>r.json());
        if (!r.success) return Swal.fire('Error', r.message, 'error');
        ENCUESTA_ID = null; CENTRO_SELECCIONADO = null;
        location.reload();
    });
    </script>
</body>
</html>
