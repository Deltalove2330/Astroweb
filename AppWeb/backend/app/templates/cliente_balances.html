<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#667eea">
    <meta name="description" content="Mis Balances aprobados - visitas revisadas por el analista">
    <title>Mis Balances</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary: #667eea; --primary-end: #764ba2;
            --bg: #f0f2f8; --card-bg: #fff; --text: #1e293b;
            --muted: #64748b; --border: #e2e8f0;
        }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
        .bal-header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-end) 100%); color: #fff; padding: 20px 0 18px; box-shadow: 0 4px 24px rgba(102,126,234,.35); position: sticky; top: 0; z-index: 100; }
        .bal-header h1 { font-size: 1.3rem; font-weight: 800; margin: 0; }
        .bal-header small { opacity: .88; font-size: .82rem; }
        .stat-card { border: none; border-radius: 16px; background: var(--card-bg); box-shadow: 0 2px 14px rgba(0,0,0,.07); padding: 16px 20px; }
        .stat-card .stat-value { font-size: 1.75rem; font-weight: 800; color: var(--primary); line-height: 1; }
        .stat-card .stat-label { font-size: .74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }
        .stat-card .stat-icon { font-size: 1.6rem; opacity: .18; }
        .filters-card { border: none; border-radius: 16px; background: var(--card-bg); box-shadow: 0 2px 14px rgba(0,0,0,.07); }
        .form-label { font-weight: 600; font-size: .8rem; color: #374151; }
        .form-control, .form-select { border-radius: 10px; border-color: var(--border); font-size: .86rem; }
        .form-control:focus, .form-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(102,126,234,.15); }
        .visita-card { border: none; border-radius: 16px; background: var(--card-bg); box-shadow: 0 2px 14px rgba(0,0,0,.07); overflow: hidden; transition: box-shadow .2s; animation: fadeUp .35s both; }
        .visita-card:hover { box-shadow: 0 6px 28px rgba(102,126,234,.18); }
        .visita-header { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); color: #fff; padding: 14px 20px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; user-select: none; }
        .visita-header:hover { filter: brightness(1.08); }
        .visita-badge { background: rgba(255,255,255,.15); border-radius: 8px; padding: 2px 10px; font-size: .72rem; font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
        .badge-aprobado { background: linear-gradient(135deg, #10b981, #059669); color: #fff; border-radius: 8px; padding: 3px 10px; font-size: .72rem; font-weight: 700; }
        .visita-meta { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 4px; }
        .visita-meta span { font-size: .78rem; opacity: .85; display: flex; align-items: center; gap: 4px; }
        .chevron-icon { font-size: 1.1rem; transition: transform .3s; flex-shrink: 0; }
        .chevron-icon.rotated { transform: rotate(-90deg); }
        .table-wrap { overflow-x: auto; max-height: 60vh; }
        .table { font-size: .83rem; margin-bottom: 0; }
        .table thead th { background: #f8fafc; color: #475569; font-size: .73rem; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; position: sticky; top: 0; border-bottom: 2px solid var(--border); padding: 10px 12px; }
        .table tbody td { padding: 9px 12px; vertical-align: middle; border-color: var(--border); }
        .table tbody tr:hover td { background: #f8f9ff; }
        .empty-box { padding: 70px 20px; text-align: center; color: var(--muted); }
        .empty-box i { font-size: 3.5rem; opacity: .3; display: block; margin-bottom: 12px; }
        .empty-box p { font-size: .95rem; }
        .info-alert { background: linear-gradient(135deg, #eff6ff, #dbeafe); border: 1px solid #bfdbfe; border-radius: 12px; padding: 12px 16px; font-size: .87rem; color: #1e40af; display: flex; align-items: center; gap: 10px; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 576px) { .stat-card .stat-value { font-size: 1.4rem; } .visita-header { flex-wrap: wrap; } }
    </style>
</head>
<body>
    <header class="bal-header">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
                <h1><i class="bi bi-bar-chart-line-fill me-2"></i>Mis Balances</h1>
                <small id="clienteNombre">{{ cliente_nombre }}</small>
            </div>
            <a href="{{ url_for('auth.client_photos_page') }}" class="btn btn-outline-light btn-sm rounded-pill px-3">
                <i class="bi bi-arrow-left me-1"></i> Volver
            </a>
        </div>
    </header>

    <main class="container my-4">
        <div class="info-alert mb-4">
            <i class="bi bi-check-circle-fill fs-5"></i>
            <span>Aqui veras todas las visitas con datos <strong>aprobadas</strong> por el analista o usuario revisor. Cada tarjeta muestra los productos de esa visita.</span>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="stat-card d-flex justify-content-between align-items-center">
                    <div><div class="stat-value" id="statVisitas">0</div><div class="stat-label">Visitas</div></div>
                    <i class="bi bi-calendar-check stat-icon"></i>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card d-flex justify-content-between align-items-center">
                    <div><div class="stat-value" id="statPdvs">0</div><div class="stat-label">PDVs</div></div>
                    <i class="bi bi-shop stat-icon"></i>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card d-flex justify-content-between align-items-center">
                    <div><div class="stat-value" id="statProductos">0</div><div class="stat-label">Registros</div></div>
                    <i class="bi bi-box-seam stat-icon"></i>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card d-flex justify-content-between align-items-center">
                    <div><div class="stat-value" id="statCaras">0</div><div class="stat-label">Caras totales</div></div>
                    <i class="bi bi-grid-3x3-gap stat-icon"></i>
                </div>
            </div>
        </div>

        <div class="card filters-card mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">PDV</label>
                        <select class="form-select" id="filtroPdv"><option value="">Todos</option></select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Categoria</label>
                        <select class="form-select" id="filtroCategoria"><option value="">Todas</option></select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Aprobado por</label>
                        <select class="form-select" id="filtroRevisor"><option value="">Todos</option></select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Buscar producto</label>
                        <input type="text" class="form-control" id="buscarProducto" placeholder="Nombre del producto...">
                    </div>
                </div>
            </div>
        </div>

        <div id="visitasContainer">
            <div class="empty-box">
                <div class="spinner-border text-primary" role="status" style="width:2.5rem;height:2.5rem;"></div>
                <p class="mt-3">Cargando balances...</p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    (function () {
        const clienteId = "{{ cliente_id }}";
        let allRows = [];

        function fmtNum(n) { return (n == null) ? "-" : n; }
        function fmtMoney(n) { return (n == null) ? "-" : Number(n).toLocaleString("es-VE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
        function fmtDate(s) {
            if (!s) return "-";
            const d = new Date(s);
            return isNaN(d) ? s : d.toLocaleDateString("es-VE", { day: "2-digit", month: "short", year: "numeric" });
        }
        function fmtDateTime(s) {
            if (!s) return "-";
            const d = new Date(s);
            return isNaN(d) ? s : d.toLocaleString("es-VE", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
        }
        function escHtml(s) {
            if (!s) return "";
            return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
        function unique(arr, key) { return [...new Set(arr.map(x => x[key]).filter(Boolean))].sort(); }
        function fillSelect(id, vals) {
            const sel = document.getElementById(id);
            vals.forEach(v => { const o = document.createElement("option"); o.value = v; o.textContent = v; sel.appendChild(o); });
        }

        function applyFilters() {
            const pdv = document.getElementById("filtroPdv").value;
            const cat = document.getElementById("filtroCategoria").value;
            const rev = document.getElementById("filtroRevisor").value;
            const q   = document.getElementById("buscarProducto").value.trim().toLowerCase();
            return allRows.filter(b =>
                (!pdv || b.punto_interes === pdv) &&
                (!cat || b.categoria === cat) &&
                (!rev || b.revisado_por === rev) &&
                (!q   || (b.producto && b.producto.toLowerCase().includes(q)))
            );
        }

        function renderStats(rows) {
            document.getElementById("statVisitas").textContent   = new Set(rows.map(r => r.id_visita).filter(Boolean)).size;
            document.getElementById("statPdvs").textContent      = new Set(rows.map(r => r.punto_interes).filter(Boolean)).size;
            document.getElementById("statProductos").textContent = rows.length;
            document.getElementById("statCaras").textContent     = rows.reduce((s, r) => s + (Number(r.caras) || 0), 0);
        }

        function groupByVisit(rows) {
            const map = new Map();
            rows.forEach(r => {
                const key = r.id_visita || "__sin_visita__";
                if (!map.has(key)) {
                    map.set(key, {
                        id_visita: r.id_visita, fecha_visita: r.fecha_visita,
                        fecha_revision: r.fecha_revision, revisado_por: r.revisado_por,
                        punto_interes: r.punto_interes, mercaderista: r.mercaderista, rows: []
                    });
                }
                map.get(key).rows.push(r);
            });
            return [...map.values()];
        }

        function render() {
            const rows = applyFilters();
            renderStats(rows);
            const container = document.getElementById("visitasContainer");
            if (rows.length === 0) {
                container.innerHTML = '<div class="empty-box"><i class="bi bi-inbox"></i><p>No hay balances aprobados para mostrar.<br><small>Cuando un analista guarde cambios en una visita, aparecera aqui.</small></p></div>';
                return;
            }
            const visits = groupByVisit(rows);
            const parts = ['<div class="d-flex flex-column gap-3">'];
            visits.forEach(function(v, idx) {
                const cid = "collapse-" + idx;
                const prods = v.rows;
                const pdvNombre = escHtml(v.punto_interes || "PDV sin nombre");
                const revisor  = escHtml(v.revisado_por || "Analista");
                const mercad   = escHtml(v.mercaderista || "-");
                const nProd    = prods.length;
                const delay    = (idx * 0.05).toFixed(2);

                let card = '<div class="visita-card" style="animation-delay:' + delay + 's">';
                card += '<div class="visita-header" data-bs-toggle="collapse" data-bs-target="#' + cid + '" aria-expanded="true">';
                card += '<div class="flex-grow-1">';
                card += '<div class="d-flex align-items-center gap-2 flex-wrap mb-1">';
                card += '<span style="font-size:.95rem;font-weight:700;"><i class="bi bi-shop me-1 opacity-75"></i>' + pdvNombre + '</span>';
                card += '<span class="badge-aprobado"><i class="bi bi-check2-circle me-1"></i>Aprobada</span>';
                card += '<span class="visita-badge">' + nProd + ' producto' + (nProd !== 1 ? 's' : '') + '</span>';
                card += '</div>';
                card += '<div class="visita-meta">';
                card += '<span><i class="bi bi-calendar3"></i> ' + fmtDate(v.fecha_visita || (prods[0] && prods[0].fecha)) + '</span>';
                card += '<span><i class="bi bi-person"></i> ' + mercad + '</span>';
                card += '<span><i class="bi bi-patch-check"></i> Aprobado por <strong>' + revisor + '</strong></span>';
                card += '<span><i class="bi bi-clock"></i> ' + fmtDateTime(v.fecha_revision) + '</span>';
                card += '</div></div>';
                card += '<i class="bi bi-chevron-down chevron-icon"></i>';
                card += '</div>';
                card += '<div id="' + cid + '" class="collapse show">';
                card += '<div class="table-wrap"><table class="table table-hover mb-0"><thead><tr>';
                card += '<th>Producto</th><th>Categoria</th><th>Fabricante</th>';
                card += '<th class="text-end">Inv. Inicial</th><th class="text-end">Inv. Deposito</th>';
                card += '<th class="text-end">Inv. Final</th><th class="text-end">Caras</th>';
                card += '<th class="text-end">Precio Bs</th><th class="text-end">Precio $</th>';
                card += '</tr></thead><tbody>';
                prods.forEach(function(b) {
                    card += '<tr>';
                    card += '<td><strong>' + escHtml(b.producto || '-') + '</strong></td>';
                    card += '<td>' + escHtml(b.categoria || '-') + '</td>';
                    card += '<td>' + escHtml(b.fabricante || '-') + '</td>';
                    card += '<td class="text-end">' + fmtNum(b.inv_inicial) + '</td>';
                    card += '<td class="text-end">' + fmtNum(b.inv_deposito) + '</td>';
                    card += '<td class="text-end">' + fmtNum(b.inv_final) + '</td>';
                    card += '<td class="text-end">' + fmtNum(b.caras) + '</td>';
                    card += '<td class="text-end">' + fmtMoney(b.precio_bs) + '</td>';
                    card += '<td class="text-end">' + fmtMoney(b.precio_ds) + '</td>';
                    card += '</tr>';
                });
                card += '</tbody></table></div></div></div>';
                parts.push(card);
            });
            parts.push('</div>');
            container.innerHTML = parts.join('');

            document.querySelectorAll('[data-bs-toggle="collapse"]').forEach(function(btn) {
                const t = document.querySelector(btn.dataset.bsTarget);
                if (!t) return;
                t.addEventListener("show.bs.collapse",  function() { const ic = btn.querySelector(".chevron-icon"); if (ic) ic.classList.remove("rotated"); });
                t.addEventListener("hide.bs.collapse",  function() { const ic = btn.querySelector(".chevron-icon"); if (ic) ic.classList.add("rotated"); });
            });
        }

        function load() {
            let url = "/api/client-balances";
            if (clienteId) url += "?cliente_id=" + encodeURIComponent(clienteId);
            fetch(url, { credentials: "include" })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (!Array.isArray(data)) {
                        document.getElementById("visitasContainer").innerHTML =
                            '<div class="empty-box"><i class="bi bi-exclamation-triangle"></i><p>' +
                            (data.error || "No se pudieron cargar los balances.") + '</p></div>';
                        return;
                    }
                    allRows = data;
                    fillSelect("filtroPdv",      unique(allRows, "punto_interes"));
                    fillSelect("filtroCategoria", unique(allRows, "categoria"));
                    fillSelect("filtroRevisor",   unique(allRows, "revisado_por"));
                    render();
                })
                .catch(function() {
                    document.getElementById("visitasContainer").innerHTML =
                        '<div class="empty-box"><i class="bi bi-wifi-off"></i><p>Error de conexion.</p></div>';
                });
        }

        document.getElementById("filtroPdv").addEventListener("change", render);
        document.getElementById("filtroCategoria").addEventListener("change", render);
        document.getElementById("filtroRevisor").addEventListener("change", render);
        document.getElementById("buscarProducto").addEventListener("input", render);
        load();
    })();
    </script>
</body>
</html>
