<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#667eea">
    <title>Mis Balances</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f4f6fb; color: #2c3e50; font-family: 'Segoe UI', system-ui, sans-serif; }
        .bal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff; padding: 18px 0; box-shadow: 0 4px 20px rgba(0,0,0,.15);
        }
        .bal-header h1 { font-size: 1.35rem; font-weight: 700; margin: 0; }
        .bal-header small { opacity: .9; }
        .stat-card {
            border: none; border-radius: 14px; background: #fff;
            box-shadow: 0 2px 12px rgba(0,0,0,.06); padding: 16px 18px; height: 100%;
        }
        .stat-card .stat-value { font-size: 1.6rem; font-weight: 700; color: #4338ca; line-height: 1; }
        .stat-card .stat-label { font-size: .8rem; color: #6c757d; text-transform: uppercase; letter-spacing: .03em; }
        .stat-card i { font-size: 1.5rem; opacity: .25; }
        .filters-card { border: none; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
        .table-card { border: none; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.06); overflow: hidden; }
        .table thead th {
            background: #1f2937; color: #fff; font-size: .78rem; text-transform: uppercase;
            letter-spacing: .03em; white-space: nowrap; position: sticky; top: 0; z-index: 2;
        }
        .table tbody td { font-size: .88rem; vertical-align: middle; }
        .table-wrap { max-height: 65vh; overflow: auto; }
        .badge-aprobado { background: #d1fae5; color: #065f46; font-weight: 600; }
        .form-label { font-weight: 600; font-size: .82rem; color: #374151; }
        .empty-box { padding: 60px 20px; text-align: center; color: #9ca3af; }
        .empty-box i { font-size: 3rem; opacity: .4; }
    </style>
</head>
<body>
    <header class="bal-header">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
                <h1><i class="bi bi-bar-chart-line-fill me-2"></i>Mis Balances</h1>
                <small id="clienteNombre">{{ cliente_nombre }}</small>
            </div>
            <a href="{{ url_for('auth.client_photos_page') }}" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Volver
            </a>
        </div>
    </header>

    <main class="container my-4">
        <div class="alert alert-info d-flex align-items-center" role="alert">
            <i class="bi bi-info-circle-fill me-2"></i>
            <span>Aquí ves únicamente los balances <strong>aprobados</strong> (visitas ya revisadas por el analista).</span>
        </div>

        <!-- Tarjetas resumen -->
        <div class="row g-3 mb-3">
            <div class="col-6 col-md-3">
                <div class="stat-card d-flex justify-content-between align-items-center">
                    <div><div class="stat-value" id="statRegistros">0</div><div class="stat-label">Registros</div></div>
                    <i class="bi bi-list-check"></i>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card d-flex justify-content-between align-items-center">
                    <div><div class="stat-value" id="statPdvs">0</div><div class="stat-label">PDVs</div></div>
                    <i class="bi bi-shop"></i>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card d-flex justify-content-between align-items-center">
                    <div><div class="stat-value" id="statProductos">0</div><div class="stat-label">Productos</div></div>
                    <i class="bi bi-box-seam"></i>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card d-flex justify-content-between align-items-center">
                    <div><div class="stat-value" id="statCaras">0</div><div class="stat-label">Caras totales</div></div>
                    <i class="bi bi-grid-3x3-gap"></i>
                </div>
            </div>
        </div>

        <!-- Filtros -->
        <div class="card filters-card mb-3">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">PDV</label>
                        <select class="form-select" id="filtroPdv"><option value="">Todos</option></select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Categoría</label>
                        <select class="form-select" id="filtroCategoria"><option value="">Todas</option></select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Buscar producto</label>
                        <input type="text" class="form-control" id="buscarProducto" placeholder="Nombre del producto">
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabla -->
        <div class="card table-card">
            <div class="table-wrap">
                <table class="table table-striped table-hover mb-0">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>PDV</th>
                            <th>Mercaderista</th>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th class="text-end">Inv. Inicial</th>
                            <th class="text-end">Inv. Depósito</th>
                            <th class="text-end">Inv. Final</th>
                            <th class="text-end">Caras</th>
                            <th class="text-end">Precio Bs</th>
                            <th class="text-end">Precio $</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyBalances">
                        <tr><td colspan="11" class="empty-box"><div class="spinner-border text-primary" role="status"></div><div class="mt-2">Cargando balances...</div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    (function () {
        const clienteId = "{{ cliente_id }}";
        let balances = [];

        function fmtNum(n) { return (n === null || n === undefined) ? '-' : n; }
        function fmtMoney(n) { return (n === null || n === undefined) ? '-' : Number(n).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
        function fmtDate(s) { if (!s) return '-'; const d = new Date(s); return isNaN(d) ? s : d.toLocaleDateString('es-VE'); }

        function unique(arr, key) {
            return [...new Set(arr.map(x => x[key]).filter(Boolean))].sort();
        }

        function fillSelect(id, values) {
            const sel = document.getElementById(id);
            values.forEach(v => {
                const o = document.createElement('option');
                o.value = v; o.textContent = v; sel.appendChild(o);
            });
        }

        function applyFilters() {
            const pdv = document.getElementById('filtroPdv').value;
            const cat = document.getElementById('filtroCategoria').value;
            const q = document.getElementById('buscarProducto').value.trim().toLowerCase();
            return balances.filter(b =>
                (!pdv || b.punto_interes === pdv) &&
                (!cat || b.categoria === cat) &&
                (!q || (b.producto && b.producto.toLowerCase().includes(q)))
            );
        }

        function renderStats(rows) {
            document.getElementById('statRegistros').textContent = rows.length;
            document.getElementById('statPdvs').textContent = new Set(rows.map(r => r.punto_interes).filter(Boolean)).size;
            document.getElementById('statProductos').textContent = new Set(rows.map(r => r.producto).filter(Boolean)).size;
            document.getElementById('statCaras').textContent = rows.reduce((s, r) => s + (Number(r.caras) || 0), 0);
        }

        function render() {
            const rows = applyFilters();
            renderStats(rows);
            const tbody = document.getElementById('tbodyBalances');
            if (rows.length === 0) {
                tbody.innerHTML = '<tr><td colspan="11" class="empty-box"><i class="bi bi-inbox"></i><div class="mt-2">No hay balances aprobados para mostrar.</div></td></tr>';
                return;
            }
            tbody.innerHTML = rows.map(b => `
                <tr>
                    <td>${fmtDate(b.fecha)}</td>
                    <td>${b.punto_interes || '-'}</td>
                    <td>${b.mercaderista || '-'}</td>
                    <td>${b.producto || '-'}</td>
                    <td>${b.categoria || '-'}</td>
                    <td class="text-end">${fmtNum(b.inv_inicial)}</td>
                    <td class="text-end">${fmtNum(b.inv_deposito)}</td>
                    <td class="text-end">${fmtNum(b.inv_final)}</td>
                    <td class="text-end">${fmtNum(b.caras)}</td>
                    <td class="text-end">${fmtMoney(b.precio_bs)}</td>
                    <td class="text-end">${fmtMoney(b.precio_ds)}</td>
                </tr>
            `).join('');
        }

        function load() {
            let url = '/api/client-balances';
            if (clienteId) url += '?cliente_id=' + encodeURIComponent(clienteId);
            fetch(url, { credentials: 'include' })
                .then(r => r.json())
                .then(data => {
                    if (!Array.isArray(data)) {
                        document.getElementById('tbodyBalances').innerHTML =
                            '<tr><td colspan="11" class="empty-box"><i class="bi bi-exclamation-triangle"></i><div class="mt-2">' +
                            (data.error || 'No se pudieron cargar los balances') + '</div></td></tr>';
                        return;
                    }
                    balances = data;
                    fillSelect('filtroPdv', unique(balances, 'punto_interes'));
                    fillSelect('filtroCategoria', unique(balances, 'categoria'));
                    render();
                })
                .catch(err => {
                    console.error('Error cargando balances:', err);
                    document.getElementById('tbodyBalances').innerHTML =
                        '<tr><td colspan="11" class="empty-box"><i class="bi bi-wifi-off"></i><div class="mt-2">Error de conexión.</div></td></tr>';
                });
        }

        document.getElementById('filtroPdv').addEventListener('change', render);
        document.getElementById('filtroCategoria').addEventListener('change', render);
        document.getElementById('buscarProducto').addEventListener('input', render);
        load();
    })();
    </script>
</body>
</html>
