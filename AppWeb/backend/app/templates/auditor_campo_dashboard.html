<!--/app/templates/auditor_campo_dashboard.html-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditor de Campo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;font-family:'Segoe UI',sans-serif;color:#fff}
        .card-glass{background:rgba(255,255,255,.12);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:18px}
    </style>
</head>
<body>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0"><i class="fas fa-clipboard-check me-2"></i>Auditor de Campo</h2>
            <small class="opacity-75">{{ nombre }} · CI {{ cedula }}</small>
        </div>
        <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-light btn-sm"><i class="fas fa-sign-out-alt me-1"></i>Salir</a>
    </div>
    <div class="row g-4">
        <div class="col-md-6">
            <div class="card-glass p-4 h-100">
                <h5 class="fw-bold"><i class="fas fa-route me-2"></i>Realizar auditoría</h5>
                <p class="opacity-75">Activa tu ruta, selecciona PDV y cliente, y carga el cuestionario y fotos por categoría.</p>
                <a href="{{ url_for('auditor_campo.carga') }}" class="btn btn-light fw-bold"><i class="fas fa-play me-1"></i>Iniciar</a>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card-glass p-4 h-100">
                <h5 class="fw-bold"><i class="fas fa-info-circle me-2"></i>Tipo</h5>
                <p class="opacity-75 mb-0">{{ tipo }}</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
