<!--/app/templates/auditor_campo_dashboard.html-->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auditoría de Campo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
 :root{--ink:#1f2333;--muted:#6b7280;--line:#e9ebf4;--bg:#f4f5fa;--brand:#5b5bf0;--brand2:#8b5cf6;--brand-soft:#eef0ff;--ok:#10b981;--shadow:0 8px 26px rgba(40,44,90,.08)}
 *{box-sizing:border-box}
 body{background:var(--bg);font-family:'Segoe UI',system-ui,sans-serif;margin:0;color:var(--ink);-webkit-font-smoothing:antialiased}
 .hdr{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 4px 18px rgba(80,70,230,.25)}
 .hdr-in{max-width:720px;margin:0 auto;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
 .brand{display:flex;align-items:center;gap:11px;min-width:0}
 .brand .logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:19px;flex:0 0 auto}
 .brand b{display:block;font-weight:700;line-height:1.1;white-space:nowrap}
 .brand small{opacity:.85;font-size:.76rem}
 .exit{background:rgba(255,255,255,.16);border:none;color:#fff;border-radius:10px;padding:9px 13px;font-weight:600;font-size:.85rem;text-decoration:none;white-space:nowrap}
 .exit:hover{background:rgba(255,255,255,.28)}
 .wrap{max-width:720px;margin:0 auto;padding:18px 14px}
 .hero{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:26px;text-align:center;margin-bottom:14px}
 .hero .big{width:64px;height:64px;border-radius:18px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:28px;margin:0 auto 14px}
 .hero h4{font-weight:800;margin:0 0 4px;letter-spacing:-.01em}
 .hero p{color:var(--muted);margin:0 0 18px}
 .btn-grad{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;border:none;border-radius:13px;font-weight:700;
   min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:0 26px;box-shadow:0 8px 20px rgba(91,91,240,.32);font-size:1.02rem}
 .btn-grad:hover{filter:brightness(1.05);color:#fff}
 .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
 .info{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:flex;align-items:center;gap:12px}
 .info .ic{width:42px;height:42px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:17px;flex:0 0 auto}
 .info small{color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
 .info .v{font-weight:700;line-height:1.2}
 @media(max-width:480px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="hdr"><div class="hdr-in">
  <div class="brand"><div class="logo"><i class="fas fa-clipboard-check"></i></div>
    <div><b>Auditoría de Campo</b><small>{{ nombre }} · CI {{ cedula }}</small></div></div>
  <a href="{{ url_for('auth.logout') }}" class="exit"><i class="fas fa-sign-out-alt me-1"></i>Salir</a>
</div></div>

<div class="wrap">
  <div class="hero">
    <div class="big"><i class="fas fa-route"></i></div>
    <h4>Iniciar jornada de auditoría</h4>
    <p>Activa tu ruta, visita cada PDV y registra el cuestionario y las fotos por categoría.</p>
    <a href="{{ url_for('auditor_campo.carga') }}" class="btn-grad"><i class="fas fa-play"></i> Comenzar</a>
  </div>
  <div class="grid">
    <div class="info"><div class="ic"><i class="fas fa-user-shield"></i></div>
      <div><small>Auditor</small><div class="v">{{ nombre }}</div></div></div>
    <div class="info"><div class="ic"><i class="fas fa-id-badge"></i></div>
      <div><small>Perfil</small><div class="v">{{ tipo }}</div></div></div>
  </div>
</div>
</body>
</html>
